# nginx vhost for protean-gw.aforo.ai -> the Protean Kong on 127.0.0.1:8010.
#
# Install:
#   sudo cp nginx-protean-gw.conf /etc/nginx/sites-available/protean-gw
#   sudo ln -s /etc/nginx/sites-available/protean-gw /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Install this HTTP-only version FIRST, before requesting a certificate.
# Certbot needs to answer an ACME challenge over port 80 on this hostname, and
# it will add the TLS server block and the 80 -> 443 redirect itself. Pasting a
# listen 443 block that references certificate files which do not exist yet
# makes `nginx -t` fail, which takes the whole box's nginx down on reload --
# including the live Aforo services.

server {
    listen 80;
    listen [::]:80;
    server_name protean-gw.aforo.ai;

    # Certbot writes its challenge here. Must stay reachable over plain HTTP
    # even after the redirect exists, or renewal fails silently in 90 days.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The console is browser-based and cross-origin (Vercel -> here), so
        # preflights must reach Kong rather than being answered by nginx.
        # Kong's own CORS handling is what the metering plugin expects; an
        # OPTIONS answered here would never be metered and would drift from
        # whatever Kong is configured to allow.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Metering flushes happen after the response, but a slow upstream
        # should not be cut off mid-request.
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Kong's admin API is bound to loopback and must never be proxied. This is
    # a belt-and-braces refusal in case someone later points a location at it.
    location /__admin { return 404; }
}
